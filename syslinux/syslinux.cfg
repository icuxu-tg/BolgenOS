DEFAULT bolgenos
PROMPT 0
TIMEOUT 100
UI vesamenu.c32

MENU TITLE BolgenOS
MENU BACKGROUND splash.png

LABEL bolgenos
  MENU LABEL BolgenOS (x86_64, BIOS)
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash

LABEL bolgenos-safe
  MENU LABEL BolgenOS (safe graphics)
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset

backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.35;

shadow-exclude = [
  "class_g = 'Plank'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;

---
modules-search: [ local ]

instances:
- id:       de
  module:   packagechooser
  config:   packagechooser_de.conf
- id:       bolgenos-prepare
  module:   shellprocess
  config:   shellprocess-prepare.conf
- id:       bolgenos-postinstall
  module:   shellprocess
  config:   shellprocess-bolgenos.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - packagechooser@de
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@bolgenos-prepare
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - services-systemd
  - contextualprocess
  - initcpiocfg
  - initcpio
  - bootloader
  - shellprocess@bolgenos-postinstall
  - umount
- show:
  - finished

branding: bolgenos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false

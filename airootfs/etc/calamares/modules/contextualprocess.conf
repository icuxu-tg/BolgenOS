---
dontChroot: false
packagechooser_de:
    mate:
        - "/bin/true"
    kde:
        - command: "/usr/local/bin/bolgenos-install-de kde"
          timeout: 1800
    xfce:
        - command: "/usr/local/bin/bolgenos-install-de xfce"
          timeout: 1800
    cinnamon:
        - command: "/usr/local/bin/bolgenos-install-de cinnamon"
          timeout: 1800
    gnome:
        - command: "/usr/local/bin/bolgenos-install-de gnome"
          timeout: 1800
    "*":
        - "/bin/true"

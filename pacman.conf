[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Local repo for AUR packages (calamares, yay) prepared by ./prepare-aur-localrepo.sh
[bolgenos-local]
SigLevel = Optional TrustAll
Server = file:///srv/bolgenos-localrepo

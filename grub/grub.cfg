# BolgenOS GRUB config for archiso (used if bootmodes includes 'uefi.grub')
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

set default=0
set timeout=10

menuentry "BolgenOS (x86_64, UEFI)" {
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "BolgenOS (x86_64, UEFI, safe graphics)" {
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

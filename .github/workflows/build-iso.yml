name: Build BolgenOS ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release with ISO, checksums, and RELEASE_SHA256.txt'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Optional release tag (e.g. v1.0.0) when publishing via workflow_dispatch'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed archiso base-devel git sudo

      - name: Create builder user and build AUR packages
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/99-builder
          su - builder -c "cd '$GITHUB_WORKSPACE' && ./prepare-aur-localrepo.sh"

      - name: Build ISO and release SHA256
        run: |
          ./release.sh
          test -s airootfs/etc/bolgenos-release.sha256
          test -s RELEASE_SHA256.txt
          test -s out/RELEASE_SHA256.txt

      - name: Upload ISO and SHA256 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bolgenos-iso
          path: |
            out/*.iso
            out/*.sha256
            out/RELEASE_SHA256.txt
            RELEASE_SHA256.txt

      - name: Determine release tag
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.create_release || inputs.release_tag != ''))
        id: release_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${INPUT_RELEASE_TAG}" ]]; then
            TAG="${INPUT_RELEASE_TAG}"
          else
            TAG="bolgenos-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.create_release || inputs.release_tag != ''))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: BolgenOS ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          files: |
            out/*.iso
            out/*.sha256
            RELEASE_SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

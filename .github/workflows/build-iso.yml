name: Build BolgenOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed archiso base-devel git sudo

      - name: Create builder user and build AUR packages
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/99-builder
          su - builder -c "cd '$GITHUB_WORKSPACE' && ./prepare-aur-localrepo.sh"

      - name: Build ISO and checksum
        run: |
          ./release.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolgenos-iso
          path: |
            out/*.iso
            out/*.sha256
